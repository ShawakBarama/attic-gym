<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attic Gym — Progress Log</title>
<meta name="theme-color" content="#161e2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Attic Gym">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23161e2b'/%3E%3Cg stroke='%23ff7a59' stroke-width='11' stroke-linecap='round'%3E%3Cline x1='40' y1='90' x2='140' y2='90'/%3E%3Cline x1='40' y1='66' x2='40' y2='114'/%3E%3Cline x1='140' y1='66' x2='140' y2='114'/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Attic%20Gym%20Progress%20Log%22%2C%22short_name%22%3A%22Attic%20Gym%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23161e2b%22%2C%22theme_color%22%3A%22%23161e2b%22%2C%22start_url%22%3A%22.%22%7D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161e2b; --panel:#1f293a; --panel2:#243044; --line:#303d52;
    --ink:#eef2f6; --muted:#8696b0; --dim:#63748f;
    --coral:#ff7a59; --coral-dim:#ffb38a; --steel:#7c8aa3; --ok:#5fd0a0;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif;
    font-size:15px;padding:22px 14px 80px;-webkit-text-size-adjust:100%}
  .wrap{max-width:900px;margin:0 auto}

  .mast{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}
  .eyebrow{font-family:"Oswald",sans-serif;letter-spacing:.3em;text-transform:uppercase;
    font-size:11px;color:var(--coral);margin:0 0 8px}
  h1{font-family:"Oswald",sans-serif;font-weight:700;text-transform:uppercase;
    font-size:clamp(26px,7vw,40px);line-height:1;margin:0}
  .status{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .pip{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:0 0 auto}
  .pip.on{background:var(--ok)} .pip.warn{background:var(--coral)}

  nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--muted);
    font-family:"Oswald",sans-serif;font-size:13px;letter-spacing:.09em;text-transform:uppercase;
    padding:9px 13px;border-radius:7px;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--coral);border-color:var(--coral);color:#20140f;font-weight:600}
  .tab:focus-visible{outline:2px solid var(--coral-dim);outline-offset:2px}

  .phead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 16px}
  .phead h2{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;
    letter-spacing:.05em;font-size:22px;margin:0}
  .phead .meta{color:var(--muted);font-size:13px}

  label.fl{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--dim);font-family:"Oswald",sans-serif;margin-bottom:5px}
  input,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:7px;padding:10px 11px;font-family:"Inter",sans-serif;font-size:15px;width:100%}
  input:focus,textarea:focus{outline:2px solid var(--coral);border-color:var(--coral)}
  input::placeholder{color:var(--dim)}

  /* date + today */
  .daterow{display:flex;gap:8px;align-items:flex-end;margin-bottom:18px}
  .daterow > div{flex:1 1 auto;max-width:230px}
  .today{flex:0 0 auto;font-family:"Oswald",sans-serif;letter-spacing:.09em;text-transform:uppercase;
    font-size:13px;font-weight:600;padding:11px 15px;border-radius:7px;cursor:pointer;
    background:none;border:1px solid var(--coral);color:var(--coral)}
  .today:hover{background:var(--coral);color:#20140f}
  .today:focus-visible{outline:2px solid var(--coral-dim);outline-offset:2px}

  .ex{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 15px;margin-bottom:12px}
  .ex-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
  .ex-h h3{font-family:"Oswald",sans-serif;font-weight:600;font-size:17px;margin:0;flex:1;line-height:1.2}
  .tag{font-family:"Oswald",sans-serif;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    padding:3px 7px;border-radius:4px;flex:0 0 auto;margin-top:2px}
  .tag.load{background:var(--coral);color:#20140f}
  .tag.reps{background:var(--panel2);color:var(--steel);border:1px solid var(--line)}
  .ex-sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
  .ex-sub b{color:var(--steel);font-weight:500}

  .ladder{display:flex;gap:3px;align-items:center;margin:0 0 12px}
  .ladder i{display:block;width:100%;height:3px;border-radius:2px;background:var(--line)}
  .ladder .lab{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--dim);
    flex:0 0 auto;margin-right:6px}

  .last{font-size:12px;color:var(--dim);margin:0 0 11px;font-family:"JetBrains Mono",monospace;line-height:1.5}
  .last b{color:var(--coral-dim);font-weight:500}

  /* band chips */
  .bandwrap{margin-bottom:11px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{display:inline-flex;align-items:center;gap:7px;cursor:pointer;
    background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    border-radius:999px;padding:8px 13px 8px 10px;
    font-family:"Oswald",sans-serif;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;
    transition:transform .12s ease}
  .chip .sw{width:13px;height:13px;border-radius:50%;flex:0 0 auto;
    border:1px solid #ffffff26;background:var(--c)}
  .chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--ci);font-weight:600}
  .chip[aria-pressed="true"] .sw{background:var(--ci);border-color:transparent}
  .chip:active{transform:scale(.96)}
  .chip:focus-visible{outline:2px solid var(--coral-dim);outline-offset:2px}
  .stack{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--coral-dim);
    margin-top:8px;min-height:16px}

  .side{margin-bottom:9px}
  .side .sl{font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--dim);margin-bottom:5px}
  .sets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .sets input{text-align:center;padding:10px 4px;font-family:"JetBrains Mono",monospace}

  .setrow{display:grid;grid-template-columns:20px 58px 1fr;gap:9px;align-items:center;margin-bottom:7px}
  .setno{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--dim);text-align:right}
  .setrow input{text-align:center;padding:9px 4px;font-family:"JetBrains Mono",monospace}
  .dots{display:flex;gap:6px;flex-wrap:wrap}
  .dot{width:27px;height:27px;border-radius:50%;border:none;padding:0;cursor:pointer;
    background:var(--c);opacity:.22;transition:opacity .12s ease}
  .dot[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--coral-dim)}
  .dot:focus-visible{outline:2px solid var(--coral);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){ .dot{transition:none} }
  .btn{font-family:"Oswald",sans-serif;letter-spacing:.09em;text-transform:uppercase;
    font-size:14px;font-weight:600;padding:13px 18px;border-radius:8px;border:none;
    background:var(--coral);color:#20140f;cursor:pointer}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--muted);font-weight:500}
  .btn.danger{background:none;border:1px solid var(--coral);color:var(--coral);font-weight:500}
  .btn.sm{padding:7px 12px;font-size:11.5px}
  .btn:focus-visible{outline:2px solid var(--coral-dim);outline-offset:2px}
  .btn-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(140%);
    background:var(--panel2);border:1px solid var(--coral);color:var(--ink);
    padding:11px 18px;border-radius:9px;font-size:14px;z-index:50;
    transition:transform .28s ease;box-shadow:0 8px 30px #0008}
  .toast.up{transform:translateX(-50%) translateY(0)}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--dim);text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);font-weight:500}
  td{padding:9px;border-bottom:1px solid #2a3548;color:var(--ink)}
  td.num{font-family:"JetBrains Mono",monospace;color:var(--coral-dim)}
  .scroll{overflow-x:auto}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:15px;margin-bottom:12px}
  .card h4{font-family:"Oswald",sans-serif;font-weight:600;font-size:15px;margin:0 0 4px;text-transform:uppercase}
  .card .when{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--dim);margin-bottom:9px}
  .card ul{margin:0;padding-left:0;list-style:none}
  .card li{font-size:13px;color:var(--muted);padding:3px 0;display:flex;gap:8px}
  .card li span:last-child{font-family:"JetBrains Mono",monospace;color:var(--coral-dim);margin-left:auto;text-align:right}

  .empty{border:1px dashed var(--line);border-radius:11px;padding:22px;text-align:center;color:var(--muted);font-size:14px}
  .note{color:var(--muted);font-size:12.5px;line-height:1.55}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .three{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  hr.sep{border:none;border-top:1px solid var(--line);margin:26px 0 18px}
  h3.sub{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:.07em;
    font-size:15px;color:var(--steel);margin:0 0 12px}
  .stat{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px}
  .stat div{min-width:88px}
  .stat .k{font-family:"Oswald",sans-serif;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .stat .v{font-family:"JetBrains Mono",monospace;font-size:20px;margin-top:3px}
  .spark{width:100%;height:70px;display:block;margin-bottom:6px}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11.5px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid #ffffff26}
  @media (max-width:420px){ .two{grid-template-columns:1fr} .sets{gap:5px} }
  @media (prefers-reduced-motion:reduce){ .toast,.chip{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <p class="eyebrow">Attic Gym · Every Minute On The Minute</p>
    <h1>Progress Log</h1>
    <div class="status"><span class="pip" id="pip"></span><span id="statusText">Loading your log…</span></div>
  </header>
  <nav id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   BAND REPERTOIRE — ordered lightest to heaviest
   ============================================================ */
const BANDS = [
  {id:"yellow",     label:"Yellow",      hint:"very light", c:"#f4d03f", ci:"#241c04"},
  {id:"light-red",  label:"Light red",   hint:"light",      c:"#e2705f", ci:"#2b0d08"},
  {id:"heavy-red",  label:"Heavy red",   hint:"",           c:"#bf3428", ci:"#fff4f2"},
  {id:"light-black",label:"Light black", hint:"",           c:"#5c6672", ci:"#f2f5f8"},
  {id:"heavy-black",label:"Heavy black", hint:"",           c:"#262c35", ci:"#e7ecf2"},
  {id:"purple",     label:"Purple",      hint:"",           c:"#8763c4", ci:"#f6f2ff"},
  {id:"green",      label:"Green",       hint:"heaviest",   c:"#2f9e5f", ci:"#f0fff6"}
];
const BAND_BY_ID = Object.fromEntries(BANDS.map(b=>[b.id,b]));
const GRIPPERS = [
  {id:"g100",label:"100 lb",hint:"lightest",c:"#6d8fb0",ci:"#0d1620"},
  {id:"g150",label:"150 lb",hint:"",c:"#42689c",ci:"#eef4fb"},
  {id:"g200",label:"200 lb",hint:"heaviest",c:"#26405f",ci:"#eef4fb"}
];
const GRIP_BY_ID = Object.fromEntries(GRIPPERS.map(g=>[g.id,g]));
const bandNames = ids => (ids||[]).map(i=>BAND_BY_ID[i]?BAND_BY_ID[i].label:i).join(" + ");

/* ============================================================
   PROGRAM — load config per exercise
   bands:true → chips · weight:"label" → kg field · note:"label" → text field
   ============================================================ */
const PROGRAM = {
  Monday:{ focus:"Upper A + Wrists", total:36, ex:[
    {id:"mon1",name:"Weighted dips",detail:"vest",sets:4,uni:false,reps:"6–12",mode:"load",min:[1,4],weight:"Vest (kg)"},
    {id:"mon2",name:"Ring inverted row",detail:"feet elevated",sets:4,uni:false,reps:"6–12",mode:"load",min:[5,8],weight:"Vest (kg)",note:"Feet height"},
    {id:"mon3",name:"Lat prayer",detail:"",sets:4,uni:false,reps:"12–20",mode:"reps",min:[9,12],bands:true},
    {id:"mon4",name:"Low press-around",detail:"",sets:4,uni:true,reps:"12–20",mode:"reps",min:[13,20],bands:true},
    {id:"mon5",name:"Ring triceps extension",detail:"impossible dip progression",sets:4,uni:false,reps:"12–20",mode:"reps",min:[21,24],note:"Ring height / body angle"},
    {id:"mon6",name:"Hammer curl",detail:"",sets:4,uni:false,reps:"12–20",mode:"reps",min:[25,28],bands:true},
    {id:"mon7",name:"Wrist flexion & extension",detail:"forearm braced, hand past the knee — pause at the top",sets:4,uni:false,dual:true,reps:"12–20",mode:"reps",min:[29,32],bands:true},
    {id:"mon8",name:"Wrist rotation",detail:"pronation & supination — elbow pinned to your ribs",sets:4,uni:false,dual:true,reps:"12–20",mode:"reps",min:[33,36],bands:true}
  ]},
  Tuesday:{ focus:"Lower A + Shoulders", total:36, ex:[
    {id:"tue1",name:"Bulgarian split squat",detail:"",sets:4,uni:true,reps:"6–12",mode:"load",min:[1,8],bands:true,weight:"Vest (kg)"},
    {id:"tue2",name:"Nordic curl",detail:"progress by leverage",sets:4,uni:false,reps:"6–12",mode:"load",min:[9,12],note:"Lever / assistance"},
    {id:"tue3",name:"High row",detail:"",sets:4,uni:false,reps:"12–20",mode:"reps",min:[13,16],bands:true},
    {id:"tue4",name:"Unilateral shoulder press",detail:"kept for the core demand too",sets:4,uni:true,reps:"12–20",mode:"reps",min:[17,24],bands:true},
    {id:"tue5",name:"Lateral raise",detail:"stay light",sets:4,uni:true,reps:"12–20",mode:"reps",min:[25,32],bands:true},
    {id:"tue6",name:"Hanging leg raise",detail:"compression driver — progress toward straight legs",sets:4,uni:false,reps:"12–20",mode:"reps",min:[33,36],note:"Variation"}
  ]},
  Thursday:{ focus:"Upper B", total:32, ex:[
    {id:"thu1",name:"Pull-ups",detail:"assisted",sets:4,uni:false,reps:"6–12",mode:"load",min:[1,4],bands:true,weight:"Assist (kg)",bandRole:"assist"},
    {id:"thu2",name:"Seated row",detail:"",sets:4,uni:false,reps:"6–12",mode:"load",min:[5,8],bands:true},
    {id:"thu3",name:"One-arm row",detail:"",sets:4,uni:true,reps:"12–20",mode:"reps",min:[9,16],bands:true},
    {id:"thu4",name:"High press-around",detail:"",sets:4,uni:true,reps:"12–20",mode:"reps",min:[17,24],bands:true},
    {id:"thu5",name:"Biceps curl",detail:"",sets:4,uni:false,reps:"12–20",mode:"reps",min:[25,28],bands:true},
    {id:"thu6",name:"Triceps pushdown",detail:"",sets:4,uni:false,reps:"12–20",mode:"reps",min:[29,32],bands:true}
  ]},
  Friday:{ focus:"Lower B + Shoulders + Wrists", total:36, ex:[
    {id:"fri1",name:"Band hack squat",detail:"→ belt squat once the band box is built",sets:4,uni:false,reps:"6–12",mode:"load",min:[1,4],bands:true},
    {id:"fri10",name:"Pike push-up",detail:"handstand push-up progression — band assists",sets:4,uni:false,reps:"6–12",mode:"load",min:[5,8],bands:true,bandRole:"assist",note:"Feet height / parallettes"},
    {id:"fri2",name:"Ring leg curl",detail:"",sets:4,uni:false,reps:"12–20",mode:"reps",min:[9,12],note:"Position"},
    {id:"fri3",name:"Band pull-apart",detail:"",sets:4,uni:false,reps:"12–20",mode:"reps",min:[13,16],bands:true},
    {id:"fri5",name:"Shrugs",detail:"",sets:4,uni:false,reps:"12–20",mode:"reps",min:[17,20],bands:true},
    {id:"fri6",name:"Ab crunch",detail:"band from bar",sets:4,uni:false,reps:"12–20",mode:"reps",min:[21,24],bands:true},
    {id:"fri11",name:"Wrist load progression",detail:"fingers forward on the floor — rock weight over the hands",sets:4,uni:false,reps:"8–12",mode:"load",min:[25,28],note:"Stage 1–5"},
    {id:"fri8",name:"Gripper hold + deviation",detail:"gripper shut, fist wipes thumb-ward and pinky-ward",sets:4,uni:false,dual:true,reps:"8–12",mode:"load",min:[29,32],grippers:true,bands:true},
    {id:"fri9",name:"Wrist flexion & extension",detail:"pause at the end range",sets:4,uni:false,dual:true,reps:"12–20",mode:"reps",min:[33,36],bands:true}
  ]}
};
const DAYS=["Monday","Tuesday","Thursday","Friday"];
const TABS=[...DAYS,"Mobility","Body","Data"];

/* ============================================================
   STORAGE
   ============================================================ */
const KEY="attic:trainingLog:v1";
let DB={sessions:[],body:[],mobility:[],drafts:{}};
let canPersist=false;
let sel={};                 // "exerciseId|kind" -> Set of selected chip ids
let currentDay=null;        // day whose form is on screen
let draftTimer=null;        // debounce for autosave

const ARTIFACT_STORE = !!(window.storage && window.storage.set);
function localWritable(){
  try{ localStorage.setItem("__attic_probe","1"); localStorage.removeItem("__attic_probe"); return true; }
  catch(e){ return false; }
}
async function readRaw(){
  if(ARTIFACT_STORE){ const r=await window.storage.get(KEY); return r && r.value; }
  return localStorage.getItem(KEY);
}
async function writeRaw(s){
  if(ARTIFACT_STORE){ await window.storage.set(KEY,s); return; }
  localStorage.setItem(KEY,s);
}
async function loadAll(){
  canPersist = ARTIFACT_STORE || localWritable();
  if(!canPersist){ setStatus(false,"This browser is blocking storage — export before you close"); return; }
  try{
    const raw = await readRaw();
    if(raw){ const p=JSON.parse(raw);
      DB={sessions:p.sessions||[],body:p.body||[],mobility:p.mobility||[],drafts:p.drafts||{}}; }
    setStatus(true,summaryLine());
  }catch(e){ setStatus(true,"New log — nothing recorded yet"); }
}
async function persist(){
  if(!canPersist) return false;
  try{ await writeRaw(JSON.stringify(DB)); setStatus(true,summaryLine()); return true; }
  catch(e){ setStatus(false,"Couldn't save — export your data to keep it"); return false; }
}
function summaryLine(){
  const s=DB.sessions.length,b=DB.body.length,m=DB.mobility.length;
  if(!s&&!b&&!m) return "New log — nothing recorded yet";
  return `${s} session${s===1?"":"s"} · ${b} body entr${b===1?"y":"ies"} · ${m} mobility check${m===1?"":"s"}`;
}
function setStatus(ok,text){
  document.getElementById("pip").className="pip "+(ok?"on":"warn");
  document.getElementById("statusText").textContent=text;
}

/* ============================================================
   HELPERS
   ============================================================ */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!==undefined)n.innerHTML=h;return n;};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const today=()=>new Date().toISOString().slice(0,10);
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:null;};
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("up");
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("up"),2600);}
function lastFor(day,exId){
  const p=DB.sessions.filter(s=>s.day===day&&s.entries&&s.entries[exId]).sort((a,b)=>b.date.localeCompare(a.date));
  return p.length?{date:p[0].date,e:p[0].entries[exId]}:null;
}
function summarizeBandSets(bs){
  const flat=[];
  ["both","right","left"].forEach(k=>{ if(bs[k]) bs[k].forEach(a=>{ if(a&&a.length) flat.push(bandNames(a)); }); });
  if(!flat.length) return "";
  const uniq=[...new Set(flat)];
  if(uniq.length===1) return uniq[0];
  const counts={}; flat.forEach(n=>counts[n]=(counts[n]||0)+1);
  return Object.entries(counts).map(([n,c])=>`${n} ×${c}`).join(", ");
}
function fmtLoad(e,x){
  if(!e) return "–";
  if(typeof e.load==="string"&&e.load) return e.load;      // legacy entries
  const bits=[];
  if(e.grippers&&e.grippers.length) bits.push(e.grippers.map(g=>GRIP_BY_ID[g]?GRIP_BY_ID[g].label:g).join(" + ")+" gripper");
  if(e.bandSets){ const s=summarizeBandSets(e.bandSets); if(s) bits.push(s+(x&&x.bandRole==="assist"?" assist":"")); }
  if(e.bands&&e.bands.length) bits.push(bandNames(e.bands)+(x&&x.bandRole==="assist"?" assist":""));
  if(e.weight!=null) bits.push(e.weight+" kg"+(x&&x.bandRole==="assist"?" assist":""));
  if(e.note) bits.push(e.note);
  return bits.length?bits.join(" · "):"–";
}
function fmtSets(e){
  if(!e) return "";
  if(e.right||e.left){
    const r=(e.right||[]).filter(v=>v!=null).join("/"),l=(e.left||[]).filter(v=>v!=null).join("/");
    return `R ${r||"–"} · L ${l||"–"}`;
  }
  return (e.both||[]).filter(v=>v!=null).join(" / ")||"–";
}

function chipGroup(x,kind,opts,label,preset){
  const key=x.id+"|"+kind;
  const wrap=el("div","bandwrap");
  wrap.appendChild(el("label","fl",label));
  sel[key]=new Set(preset||[]);
  const chips=el("div","chips");
  const stack=el("div","stack");
  const nameOf=ids=>ids.map(i=>{const o=opts.find(z=>z.id===i);return o?o.label:i;}).join(" + ");
  const paint=()=>{
    const ids=opts.filter(o=>sel[key].has(o.id)).map(o=>o.id);
    stack.textContent = ids.length
      ? nameOf(ids)+(ids.length>1?` — ${ids.length} stacked`:"")
      : "Nothing selected";
  };
  opts.forEach(b=>{
    const c=el("button","chip"); c.type="button";
    c.style.setProperty("--c",b.c); c.style.setProperty("--ci",b.ci);
    c.setAttribute("aria-pressed",String(sel[key].has(b.id)));
    c.setAttribute("aria-label",`${b.label}${b.hint?" ("+b.hint+")":""}`);
    c.innerHTML=`<span class="sw"></span>${b.label}`;
    c.onclick=()=>{
      if(sel[key].has(b.id)) sel[key].delete(b.id); else sel[key].add(b.id);
      c.setAttribute("aria-pressed",String(sel[key].has(b.id))); paint(); markDirty();
    };
    chips.appendChild(c);
  });
  wrap.appendChild(chips); paint(); wrap.appendChild(stack);
  return wrap;
}

/* ============================================================
   DRAFT AUTOSAVE — keeps unsaved typing across a browser close
   ============================================================ */
function markDirty(){
  if(!currentDay) return;
  const d=document.getElementById("draftNote");
  if(d) d.textContent="Saving…";
  clearTimeout(draftTimer);
  draftTimer=setTimeout(()=>saveDraft(currentDay),400);
}
function collectDay(day,keepEmpty){
  const entries={}; let any=false;
  PROGRAM[day].ex.forEach(x=>{
    const e={};
    if(x.bands){
      const keys=(x.uni||x.dual)?["right","left"]:["both"];
      const bs={}; let anyBand=false;
      keys.forEach(k=>{
        bs[k]=[];
        for(let i=0;i<x.sets;i++){
          const s=sel[`${x.id}|bs|${k}|${i}`];
          const ids=s?BANDS.filter(b=>s.has(b.id)).map(b=>b.id):[];
          if(ids.length) anyBand=true;
          bs[k].push(ids);
        }
      });
      if(anyBand) e.bandSets=bs;
    }
    if(x.grippers){const s=sel[x.id+"|grippers"];const ids=GRIPPERS.filter(b=>s&&s.has(b.id)).map(b=>b.id); if(ids.length)e.grippers=ids;}
    if(x.weight){const n=$(`#wt-${x.id}`); const w=n?num(n.value):null; if(w!=null)e.weight=w;}
    if(x.note){const n=$(`#nt-${x.id}`); const t=n?n.value.trim():""; if(t)e.note=t;}
    const grab=k=>{const a=[];for(let i=0;i<x.sets;i++){const v=$(`#rp-${x.id}-${k}-${i}`);a.push(v&&v.value!==""?num(v.value):null);}return a;};
    if(x.uni||x.dual){e.right=grab("right");e.left=grab("left");} else e.both=grab("both");
    const filled=[].concat(e.right||[],e.left||[],e.both||[]).some(z=>z!=null)||e.bands||e.bandSets||e.grippers||e.weight!=null||e.note;
    if(filled){entries[x.id]=e;any=true;} else if(keepEmpty){entries[x.id]=e;}
  });
  return {entries,any};
}
async function saveDraft(day){
  const dEl=$("#sessDate"); if(!dEl) return;
  const nEl=$("#sessNotes");
  const {entries,any}=collectDay(day,false);
  DB.drafts=DB.drafts||{};
  if(!any && !(nEl&&nEl.value.trim())){ delete DB.drafts[day]; }
  else DB.drafts[day]={date:dEl.value||today(),notes:nEl?nEl.value:"",entries,at:Date.now()};
  await persist();
  const nd=document.getElementById("draftNote");
  if(nd) nd.textContent = DB.drafts[day] ? "Draft saved — safe to close the app" : "";
}

    t+=`<tr><td class="num">${r.date}</td><td class="num">${r.weight??"–"}</td><td class="num">${r.waist??"–"}</td>`+
       `<td class="num">${r.fat??"–"}</td><td class="num">${r.sleep??"–"}</td>`+
       `<td><button class="btn ghost sm" data-del="${r.id}">Delete</button></td></tr>`;});
  t+="</tbody></table>"; sc.innerHTML=t; v.appendChild(sc);
  sc.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    DB.body=DB.body.filter(z=>z.id!==b.dataset.del);await persist();render();toast("Entry deleted");});
}
function sparkline(vals){
  const W=600,H=70,p=6,mn=Math.min(...vals),mx=Math.max(...vals),rng=(mx-mn)||1;
  const pts=vals.map((v,i)=>{
    const x=p+(i*(W-2*p))/Math.max(1,vals.length-1);
    const y=H-p-((v-mn)/rng)*(H-2*p);
    return `${x.toFixed(1)},${y.toFixed(1)}`;}).join(" ");
  const s=el("div");
  s.innerHTML=`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Morning weight trend">
    <polyline points="${pts}" fill="none" stroke="var(--coral)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg><p class="note" style="margin-top:-2px">Morning weight, oldest to newest · ${mn.toFixed(1)}–${mx.toFixed(1)} kg</p>`;
  return s;
}
async function saveBody(){
  const r={id:"b"+Date.now(),date:$("#bDate").value||today(),
    weight:num($("#bWeight").value),waist:num($("#bWaist").value),
    fat:num($("#bFat").value),sleep:num($("#bSleep").value)};
  if(r.weight==null&&r.waist==null&&r.fat==null&&r.sleep==null){toast("Add at least one number");return;}
  DB.body.push(r); const ok=await persist(); render();
  toast(ok?"Entry saved":"Saved for this visit — export to keep it");
}

/* ============================================================
   DATA
   ============================================================ */
function renderData(){
  const v=$("#view"); v.innerHTML="";
  const head=el("div","phead");
  head.appendChild(el("h2",null,"Data"));
  head.appendChild(el("span","meta",summaryLine()));
  v.appendChild(head);

  const c1=el("div","card");
  c1.appendChild(el("h4",null,"Export"));
  c1.appendChild(el("p","note","Downloads everything as one JSON file. This is the format to feed a local database later, so export before any big change."));
  const br=el("div","btn-row");
  const e=el("button","btn","Download JSON"); e.onclick=exportJSON; br.appendChild(e);
  const cp=el("button","btn ghost","Copy to clipboard"); cp.onclick=copyJSON; br.appendChild(cp);
  c1.appendChild(br); v.appendChild(c1);

  const c2=el("div","card");
  c2.appendChild(el("h4",null,"Import"));
  c2.appendChild(el("p","note","Paste a previously exported file to restore or merge. Matching entries are skipped, so importing twice is safe."));
  const ta=el("textarea"); ta.rows=5; ta.id="impBox"; ta.style.marginTop="10px";
  ta.placeholder='{"sessions":[…],"body":[…],"mobility":[…]}';
  c2.appendChild(ta);
  const br2=el("div","btn-row");
  const i=el("button","btn","Import data"); i.onclick=importJSON; br2.appendChild(i);
  c2.appendChild(br2); v.appendChild(c2);

  const c3=el("div","card");
  c3.appendChild(el("h4",null,"Clear everything"));
  c3.appendChild(el("p","note","Deletes all sessions, body entries, and assessments. Export first — this can't be undone."));
  const br3=el("div","btn-row");
  const d=el("button","btn danger","Clear all data");
  d.onclick=async()=>{if(!confirm("Delete all logged data? Export first if you want to keep it."))return;
    DB={sessions:[],body:[],mobility:[],drafts:{}};await persist();render();toast("All data cleared");};
  br3.appendChild(d); c3.appendChild(br3); v.appendChild(c3);

  const c4=el("div","card");
  c4.appendChild(el("h4",null,"Band reference"));
  const lg=el("div","legend");
  BANDS.forEach(b=>lg.appendChild(el("span",null,`<i style="background:${b.c}"></i>${b.label}${b.hint?" — "+b.hint:""}`)));
  c4.appendChild(lg);
  const gl=el("div","legend");
  GRIPPERS.forEach(g=>gl.appendChild(el("span",null,`<i style="background:${g.c}"></i>${g.label}${g.hint?" — "+g.hint:""}`)));
  c4.appendChild(gl);
  c4.appendChild(el("p","note","Bands are stored by name, not an estimated kilogram figure — band tension depends on how far you stretch it, so a fake number would only mislead. Progress reads as: more reps on the same stack, then a heavier stack."));
  v.appendChild(c4);

  const c5=el("div","card");
  c5.appendChild(el("h4",null,"Install on your phone"));
  c5.appendChild(el("p","note","<b style='color:var(--steel)'>iPhone:</b> open in Safari, tap Share, then Add to Home Screen.<br><b style='color:var(--steel)'>Android:</b> open in Chrome, tap the menu, then Install app.<br><br>Typing is saved as a draft as you go, so closing mid-session loses nothing. Export a JSON backup now and then."));
  v.appendChild(c5);
}
function payload(){return JSON.stringify({version:2,exported:new Date().toISOString(),...DB},null,2);}
function exportJSON(){
  const b=new Blob([payload()],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=`attic-gym-log-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
  toast("Exported");
}
async function copyJSON(){
  try{await navigator.clipboard.writeText(payload());toast("Copied to clipboard");}
  catch(e){toast("Couldn't copy — use Download JSON instead");}
}
async function importJSON(){
  const raw=$("#impBox").value.trim();
  if(!raw){toast("Paste your exported JSON first");return;}
  let p; try{p=JSON.parse(raw);}catch(e){toast("That isn't valid JSON — check the paste");return;}
  let added=0;
  ["sessions","body","mobility"].forEach(k=>{
    if(!Array.isArray(p[k]))return;
    const have=new Set(DB[k].map(x=>x.id));
    p[k].forEach(x=>{if(x&&x.id&&!have.has(x.id)){DB[k].push(x);added++;}});
  });
  await persist(); render();
  toast(added?`Imported ${added} record${added===1?"":"s"}`:"Nothing new to import");
}

/* ============================================================
   BOOT
   ============================================================ */
function render(){
  if(DAYS.includes(active)) renderDay(active);
  else if(active==="Mobility") renderMobility();
  else if(active==="Body") renderBody();
  else renderData();
}
(async function(){renderTabs();render();await loadAll();render();})();
</script>
